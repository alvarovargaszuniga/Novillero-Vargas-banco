<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tesorería Novillero</title>
<style>
:root{--bg:#f3f5f0;--panel:#fcfdfb;--line:#dfe4d9;--fg:#161a14;--fg2:#4d5548;--accent:#3f5a1f;--bad:#b3401f}
@media (prefers-color-scheme:dark){:root{--bg:#141712;--panel:#1c201a;--line:#31372d;--fg:#f2f5ee;--fg2:#bcc4b4;--accent:#b5d483;--bad:#f08a66;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;margin:0}p{margin:0;color:var(--fg2);font-size:14px}
input[type=password]{font:16px inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
button{font:600 16px inherit;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6}label{font-size:14px;color:var(--fg2);display:flex;gap:8px;align-items:center}
#err{color:var(--bad);min-height:20px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<form id="f"><h1>Tesorería Novillero</h1><p>Página privada. Escribe la contraseña para ver los datos.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" autofocus>
<label><input type="checkbox" id="rem"> Recordar en este dispositivo</label>
<button id="go">Entrar</button><p id="err" role="alert"></p></form>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(P.s),iterations:P.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.i)},key,ub(P.c)));
}
const show=h=>{document.open();document.write(h);document.close()};
const err=document.getElementById("err"),go=document.getElementById("go");
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;if(!pw)return;
  go.disabled=true;err.textContent="";go.textContent="Abriendo…";
  try{const h=await open(pw);if(document.getElementById("rem").checked){try{localStorage.setItem(K,pw)}catch(_){}}show(h)}
  catch(_){go.disabled=false;go.textContent="Entrar";err.textContent=crypto.subtle?"Contraseña incorrecta. Revisa los guiones y vuelve a probar.":"Este navegador no puede abrir la página. Prueba con Chrome, Safari o Edge actualizados."}};
(async()=>{let s;try{s=localStorage.getItem(K)}catch(_){}if(s){try{show(await open(s))}catch(_){try{localStorage.removeItem(K)}catch(_){}}}})();
</script></body></html>
